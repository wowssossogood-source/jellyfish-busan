<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부산 해파리 대응 · 해양 관측</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4f8;color:#173047;
font-family:system-ui,"맑은 고딕",sans-serif}
main{max-width:1000px;margin:auto;padding:36px 20px}
header{margin-bottom:28px}
small{color:#337489;font-weight:700}
h1{font-size:30px;margin:10px 0}
p{line-height:1.7}
#notice{padding:15px;background:#fff;border-radius:12px}
#cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
article{background:white;border-radius:20px;padding:24px;
box-shadow:0 8px 30px #1730470a}
h2{margin-top:0}
.badge{display:inline-block;padding:6px 10px;border-radius:8px;
background:#e4f5ed;color:#196340;font-size:14px}
.old{background:#fff0d6;color:#855100}
dl{display:grid;grid-template-columns:1fr 1fr;gap:14px}
dl div{background:#f4f8fb;border-radius:12px;padding:14px}
dt{font-size:13px;color:#566c7b}
dd{margin:8px 0 0;font-size:23px;font-weight:700}
.time,footer{font-size:13px;color:#566c7b;line-height:1.8}
button{border:0;border-radius:10px;background:#126d87;color:white;
padding:12px 18px;cursor:pointer;margin:12px 0}
a{color:#126d87}
@media(max-width:650px){
#cards{grid-template-columns:1fr}h1{font-size:25px}
}
</style>
</head>
<body>
<main>
<header>
<small>BUSAN · OCEAN WATCH</small>
<h1>송정·해운대 해양 관측</h1>
<p>해파리 대응을 위한 환경정보를 확인합니다.</p>
<div id="notice" role="status">관측자료를 불러오는 중입니다.</div>
<button id="refresh">자료 다시 읽기</button>
</header>
<section id="cards"></section>
<footer>
<p>출처: 국립해양조사원 해양관측자료<br>
표시값은 각 부이 지점의 관측값입니다.
해수욕장 전체의 흐름이나 해파리 위치를 뜻하지 않습니다.<br>
30분 경과 표시는 이 시제품의 임시 기준입니다.
이 화면은 공식 해파리 예보나 입욕 안전 판정이 아닙니다.</p>
</footer>
</main>
<script>
const notice = document.querySelector("#notice");
const cards = document.querySelector("#cards");
const button = document.querySelector("#refresh");

const fields = [
  ["수온", "water_temperature_c", "℃"],
  ["풍속", "wind_speed_m_s", "m/s"],
  ["풍향 · 원자료 각도", "wind_direction_deg", "°"],
  ["유속", "current_speed_cm_s", "cm/s"],
  ["유향 · 원자료 각도", "current_direction_deg", "°"],
  ["파고", "wave_height_m", "m"]
];

function element(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

function dateText(value) {
  return new Date(value).toLocaleString("ko-KR", {
    timeZone: "Asia/Seoul", hour12: false
  });
}

async function readJSON(path) {
  const response = await fetch(path, {cache: "no-store"});
  if (!response.ok) throw new Error(path);
  return response.json();
}

async function update() {
  button.disabled = true;
  try {
    const [data, status] = await Promise.all([
      readJSON("ocean_data/latest.json"),
      readJSON("ocean_data/status.json")
    ]);
    if (!Array.isArray(data.stations) || data.stations.length !== 2) {
      throw new Error("관측소 자료 확인 필요");
    }
    cards.replaceChildren();
    const saved = data.mode !== "live_fetch";
    const collectorAge =
      (Date.now() - Date.parse(status.attempted_at)) / 60000;
    const collectorRecent = Number.isFinite(collectorAge)
      && collectorAge >= -5 && collectorAge <= 30;

    notice.textContent = saved
      ? "저장된 응답으로 만든 자료입니다. 실시간 수집 자료가 아닙니다."
      : !status.fetch_ok
      ? "최근 수집에 실패했습니다. 마지막 성공 자료를 표시합니다."
      : !collectorRecent
      ? "수집기 실행 상태를 확인하세요. 최근 수집 기록이 없습니다."
      : "수집기 최근 응답 정상 · 마지막 수집: "
        + dateText(data.fetched_at);

    for (const station of data.stations) {
      const age =
        (Date.now() - Date.parse(station.observed_at)) / 60000;
      const recent = Number.isFinite(age) && age >= -5
        && age <= 30 && station.time_state === "recent";
      const card = element("article");
      card.append(element("h2", station.station_name));
      card.append(element("span",
        recent ? "최근 관측자료" : "관측 시각 확인 필요",
        recent ? "badge" : "badge old"));
      card.append(element("p",
        "관측: " + dateText(station.observed_at), "time"));

      const list = element("dl");
      for (const [label, key, unit] of fields) {
        const box = element("div");
        const value = station.values?.[key];
        const usable = recent
          && station.provider_status?.[key] === "0"
          && typeof value === "number" && Number.isFinite(value);
        box.append(element("dt", label));
        box.append(element("dd", usable ? value + " " + unit : "—"));
        list.append(box);
      }
      card.append(list);
      card.append(element("p",
        "부이 좌표: " + station.latitude + ", " + station.longitude
        + " · —는 결측·점검·시간 경과 등의 이유로 표시하지 않은 값입니다.",
        "time"));
      cards.append(card);
    }
  } catch (error) {
    cards.replaceChildren();
    notice.textContent =
      "자료를 읽지 못했습니다. 수집기를 먼저 실행하고, "
      + "ocean_data 폴더에 latest.json과 status.json이 있는지 확인하세요.";
  } finally {
    button.disabled = false;
  }
}
button.addEventListener("click", update);
update();
setInterval(update, 30000);
</script>
</body>
</html>
